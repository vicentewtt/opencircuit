name: Build Android APK

# Wraps the web build in a Capacitor Android shell and produces an
# installable APK. The android/ project is generated on the fly, so the
# repository stays web-only.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Generate Capacitor Android project
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android

      - name: Set app version and icon
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(echo "$VERSION" | awk -F. '{ print $1*10000 + $2*100 + $3 }')
          sed -i "s/versionCode .*/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$VERSION\"/" android/app/build.gradle

          # Replace the default Capacitor launcher icon with the app icon.
          RES=android/app/src/main/res
          rm -rf "$RES"/mipmap-anydpi-v26
          for dir in "$RES"/mipmap-*; do
            cp public/icons/icon-512.png "$dir/ic_launcher.png"
            cp public/icons/icon-512.png "$dir/ic_launcher_round.png"
            rm -f "$dir/ic_launcher_foreground.png"
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "../OpenCircuit-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenCircuit-${{ env.VERSION }}-apk
          path: OpenCircuit-${{ env.VERSION }}.apk

      # Pushing a tag like v1.9.0 also publishes the APK as a GitHub release.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenCircuit-${{ env.VERSION }}.apk
